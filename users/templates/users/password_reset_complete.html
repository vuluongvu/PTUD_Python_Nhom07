{% extends 'users/base.html' %}
{% block title %}Đổi mật khẩu thành công - LapStore{% endblock %}
{% block content %}
<div class="auth-tabs">
  <button class="tab-btn active" style="width: 100%; border-radius: 8px; cursor: default;">Thành công</button>
</div>
<div class="form-container active" style="text-align: center; padding: 20px 0;">
  <div style="font-size: 50px; color: #28a745; margin-bottom: 15px;">
    <i class="fa-regular fa-circle-check"></i>
  </div>
  <p style="color: #555; margin-bottom: 20px; line-height: 1.5;">Mật khẩu của bạn đã được đặt lại thành công. Bạn có thể đăng nhập bằng mật khẩu mới ngay bây giờ.</p>
  <a href="{% url 'users:login' %}" class="btn-submit" style="display: inline-block; text-decoration: none; text-align: center; line-height: 44px; width: 100%; margin-top: 10px;">ĐĂNG NHẬP NGAY</a>
</div>
{% endblock %}
{% block social_login %}{% endblock %}
